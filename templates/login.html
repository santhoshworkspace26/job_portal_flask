<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - JobAI</title>

  <!-- Load theme before page renders to prevent flash -->
  <script>
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar scrolled">
  <div class="container">

    <a href="{{ url_for('home') }}" class="navbar-brand">
      <div class="brand-icon">J</div>
      <span>JobAI</span>
    </a>

    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('jobs') }}">Jobs</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </div>

    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle theme">&#9790;</button>
      <a href="{{ url_for('login') }}" class="btn btn-ghost">Log In</a>
      <a href="{{ url_for('register') }}" class="btn btn-primary">Sign Up</a>
    </div>

  </div>
</nav>

<!-- Login Page -->
<main class="auth-page">
  <div class="auth-card glass" style="max-width:480px">

    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Log in to your JobAI account</p>

    {% if error %}
    <div style="background:rgba(255,59,48,0.1); color:#FF3B30; padding:12px 16px; border-radius:8px; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
      {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div style="background:rgba(52,199,89,0.1); color:#34C759; padding:12px 16px; border-radius:8px; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
      {{ success }}
    </div>
    {% endif %}

    <!-- FORM -->
    <form id="login-form" action="/login" method="POST">

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-input" placeholder="Your password" required />
      </div>

      <div class="form-group" style="display:flex; align-items:center; justify-content:space-between;">
        <label class="form-check">
          <input type="checkbox" name="remember" />
          Remember me
        </label>
        <a href="#" style="font-size:0.875rem;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">
        Log In
      </button>

    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
    </div>

  </div>
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
