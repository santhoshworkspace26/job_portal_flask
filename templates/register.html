<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - JobAI</title>

  <!-- Load theme before page renders to prevent flash -->
  <script>
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar scrolled">
  <div class="container">

    <a href="{{ url_for('home') }}" class="navbar-brand">
      <div class="brand-icon">J</div>
      <span>JobAI</span>
    </a>

    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('jobs') }}">Jobs</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </div>

    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle theme">&#9790;</button>
      <a href="{{ url_for('login') }}" class="btn btn-ghost">Log In</a>
      <a href="{{ url_for('register') }}" class="btn btn-primary">Sign Up</a>
    </div>

  </div>
</nav>

<!-- Register Page -->
<main class="auth-page">
  <div class="auth-card glass" style="max-width:520px">

    <h2>Create Account</h2>
    <p class="auth-subtitle">Start your AI-powered job search journey today</p>

    {% if error %}
    <div style="background:rgba(255,59,48,0.1); color:#FF3B30; padding:12px 16px; border-radius:8px; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
      {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div style="background:rgba(52,199,89,0.1); color:#34C759; padding:12px 16px; border-radius:8px; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
      {{ success }}
    </div>
    {% endif %}

    <!-- FORM -->
    <form id="register-form" action="/register" method="POST">

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" class="form-input" placeholder="John" required />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" class="form-input" placeholder="Doe" required />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label>I am a...</label>
        <select name="role" class="form-input">
          <option value="">Select your role</option>
          <option value="developer">Software Developer</option>
          <option value="designer">Designer</option>
          <option value="manager">Project Manager</option>
          <option value="analyst">Data Analyst</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 characters" required />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" class="form-input" placeholder="Repeat password" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" id="terms" name="terms" required />
          I agree to the Terms of Service and Privacy Policy
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">
        Create Account
      </button>

    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>

  </div>
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
